name: modbus-dam-lab
services:
  device:
    build:
      context: .
      dockerfile: services/device/Dockerfile
    hostname: device
    environment:
      MODBUS_HOST: 0.0.0.0
      MODBUS_PORT: "5020"
      INITIAL_WATER_LEVEL: ${INITIAL_WATER_LEVEL:-65}
      SIMULATION_STEP: "1"
      INLET_HOST: inlet
      INLET_PORT: "5020"
    depends_on: [inlet]
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.20
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  inlet:
    build:
      context: .
      dockerfile: services/inlet/Dockerfile
    hostname: inlet
    environment:
      MODBUS_HOST: 0.0.0.0
      MODBUS_PORT: "5020"
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.21
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  openplc:
    build:
      context: .
      dockerfile: plc/Dockerfile
    hostname: openplc
    depends_on: [device, inlet]
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.10
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      memlock: 0
    restart: unless-stopped
  openplc-inlet:
    build:
      context: .
      dockerfile: plc/Dockerfile
      args:
        PLC_ROLE: inlet
    hostname: openplc-inlet
    depends_on: [device, inlet]
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.11
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      memlock: 0
    restart: unless-stopped
  temperature-sensor:
    build:
      context: .
      dockerfile: services/temperature/Dockerfile
    hostname: temperature-sensor
    environment:
      MODBUS_HOST: 0.0.0.0
      MODBUS_PORT: "5020"
      INITIAL_WATER_TEMP_C: ${INITIAL_WATER_TEMP_C:-24.0}
      WATER_TEMP_ALARM_C: ${WATER_TEMP_ALARM_C:-32.0}
      WATER_TEMP_DRIFT_C_PER_S: ${WATER_TEMP_DRIFT_C_PER_S:-0.0}
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.22
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  openplc-temp:
    build:
      context: .
      dockerfile: plc/Dockerfile
      args:
        PLC_ROLE: temperature
    hostname: openplc-temp
    depends_on: [temperature-sensor, openplc]
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.12
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      memlock: 0
    restart: unless-stopped
  openplc-supervisor:
    build:
      context: .
      dockerfile: plc/Dockerfile
      args:
        PLC_ROLE: supervisor
    hostname: openplc-supervisor
    depends_on: [openplc, openplc-inlet, openplc-temp]
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.13
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      memlock: 0
    restart: unless-stopped
  downstream-sensor:
    build:
      context: .
      dockerfile: services/downstream/Dockerfile
    hostname: downstream-sensor
    environment:
      MODBUS_HOST: 0.0.0.0
      MODBUS_PORT: "5020"
      RESERVOIR_HOST: device
      RESERVOIR_MODBUS_PORT: "5020"
      MAX_DISCHARGE_M3S: ${MAX_DISCHARGE_M3S:-200}
      DOWNSTREAM_WARNING_M3S: ${DOWNSTREAM_WARNING_M3S:-150}
      DOWNSTREAM_FLOW_BIAS_M3S: ${DOWNSTREAM_FLOW_BIAS_M3S:-0}
    depends_on: [device]
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.23
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  openplc-downstream:
    build:
      context: .
      dockerfile: plc/Dockerfile
      args:
        PLC_ROLE: downstream
    hostname: openplc-downstream
    depends_on: [downstream-sensor, openplc]
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.14
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      memlock: 0
    restart: unless-stopped
  hmi:
    build:
      context: .
      dockerfile: services/hmi/Dockerfile
    hostname: hmi
    environment:
      DEVICE_HOST: device
      INLET_HOST: inlet
      TEMPERATURE_HOST: temperature-sensor
      DOWNSTREAM_HOST: downstream-sensor
      HMI_HOST: 0.0.0.0
      HMI_PORT: "8080"
      TELEMETRY_PORT: "10555"
    depends_on: [device, inlet, temperature-sensor, downstream-sensor, openplc, openplc-inlet, openplc-temp, openplc-supervisor, openplc-downstream]
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.40
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    hostname: attacker
    entrypoint: [sleep, infinity]
    networks:
      modbus-lab:
        ipv4_address: 172.28.10.30
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
networks:
  modbus-lab:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
